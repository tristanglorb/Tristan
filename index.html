<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1A3 Class Server — Sign In</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Josefin+Sans:wght@200;300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --gold: #c9a96e; --gold-light: #e8d5a3; --gold-dark: #8a6d3b;
    --cream: #faf7f2; --dark: #0e0c09; --dark-2: #1a1713; --dark-3: #252119;
    --text-muted: #8a8070; --text-soft: #c4b99a;
  }
  html, body { height: 100%; font-family: 'Josefin Sans', sans-serif; background: var(--dark); color: var(--cream); overflow: hidden; }
  .bg { position: fixed; inset: 0; background: var(--dark); z-index: 0; }
  .bg::before { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse 80% 60% at 15% 50%, rgba(201,169,110,.07) 0%, transparent 60%), radial-gradient(ellipse 60% 80% at 85% 50%, rgba(201,169,110,.05) 0%, transparent 60%); }
  .grid-lines { position: fixed; inset: 0; z-index: 0; background-image: linear-gradient(rgba(201,169,110,.04) 1px, transparent 1px), linear-gradient(90deg, rgba(201,169,110,.04) 1px, transparent 1px); background-size: 60px 60px; }
  .corner { position: fixed; width: 120px; height: 120px; z-index: 1; opacity: .3; }
  .corner svg { width: 100%; height: 100%; }
  .corner-tl { top: 20px; left: 20px; }
  .corner-tr { top: 20px; right: 20px; transform: scaleX(-1); }
  .corner-bl { bottom: 20px; left: 20px; transform: scaleY(-1); }
  .corner-br { bottom: 20px; right: 20px; transform: scale(-1); }
  .layout { position: relative; z-index: 10; display: grid; grid-template-columns: 1fr 1fr; height: 100vh; }
  .panel-left { display: flex; flex-direction: column; justify-content: center; padding: 60px 80px; position: relative; overflow: hidden; }
  .panel-left::after { content: ''; position: absolute; right: 0; top: 10%; bottom: 10%; width: 1px; background: linear-gradient(to bottom, transparent, var(--gold), transparent); }
  .brand-mark { display: flex; align-items: center; gap: 16px; margin-bottom: 60px; animation: fadeUp .8s ease forwards; }
  .brand-icon { width: 42px; height: 42px; border: 1px solid var(--gold); display: flex; align-items: center; justify-content: center; transform: rotate(45deg); }
  .brand-icon span { display: block; width: 14px; height: 14px; background: var(--gold); transform: rotate(-45deg); }
  .brand-name { font-family: 'Cormorant Garamond', serif; font-size: 28px; font-weight: 300; letter-spacing: .3em; text-transform: uppercase; color: var(--gold-light); }
  .headline { font-family: 'Cormorant Garamond', serif; font-size: clamp(42px,5vw,72px); font-weight: 300; line-height: 1.1; color: var(--cream); margin-bottom: 28px; animation: fadeUp .8s .15s ease both; }
  .headline em { font-style: italic; color: var(--gold); }
  .tagline { font-size: 12px; letter-spacing: .25em; text-transform: uppercase; color: var(--text-muted); line-height: 1.9; max-width: 320px; animation: fadeUp .8s .25s ease both; }
  .diamonds { position: absolute; bottom: 80px; left: 80px; opacity: .15; animation: float 6s ease-in-out infinite; }
  .diamond { position: absolute; border: 1px solid var(--gold); transform: rotate(45deg); }
  .panel-right { display: flex; align-items: center; justify-content: center; padding: 60px; background: var(--dark-2); }
  .login-card { width: 100%; max-width: 400px; animation: fadeUp .8s .1s ease both; }
  .login-header { margin-bottom: 36px; text-align: center; }
  .divider-line { display: flex; align-items: center; gap: 16px; margin-bottom: 28px; }
  .divider-line::before { content: ''; flex: 1; height: 1px; background: linear-gradient(to right, transparent, var(--gold-dark)); }
  .divider-line::after  { content: ''; flex: 1; height: 1px; background: linear-gradient(to left,  transparent, var(--gold-dark)); }
  .divider-gem { width: 10px; height: 10px; border: 1px solid var(--gold); transform: rotate(45deg); flex-shrink: 0; }
  .login-title { font-family: 'Cormorant Garamond', serif; font-size: 32px; font-weight: 300; letter-spacing: .15em; text-transform: uppercase; color: var(--cream); margin-bottom: 8px; }
  .login-subtitle { font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--text-muted); }
  .tabs { display: flex; margin-bottom: 32px; border-bottom: 1px solid rgba(201,169,110,.15); }
  .tab { flex: 1; background: none; border: none; color: var(--text-muted); font-family: 'Josefin Sans', sans-serif; font-size: 11px; letter-spacing: .25em; text-transform: uppercase; padding: 10px; cursor: pointer; transition: color .3s; position: relative; }
  .tab.active { color: var(--gold); }
  .tab.active::after { content: ''; position: absolute; bottom: -1px; left: 0; right: 0; height: 1px; background: var(--gold); }
  .form-group { margin-bottom: 20px; position: relative; }
  .form-label { display: block; font-size: 10px; letter-spacing: .25em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 10px; transition: color .3s; }
  .form-group:focus-within .form-label { color: var(--gold); }
  .input-wrap { position: relative; }
  .form-input { width: 100%; background: var(--dark-3); border: 1px solid rgba(201,169,110,.15); color: var(--cream); font-family: 'Josefin Sans', sans-serif; font-size: 13px; letter-spacing: .08em; padding: 14px 18px; outline: none; transition: border-color .3s, background .3s; border-radius: 0; }
  .form-input::placeholder { color: rgba(196,185,154,.25); }
  .form-input:focus { border-color: var(--gold); background: rgba(201,169,110,.04); }
  .input-glow { position: absolute; bottom: 0; left: 0; right: 0; height: 1px; background: var(--gold); transform: scaleX(0); transition: transform .4s ease; transform-origin: left; }
  .form-group:focus-within .input-glow { transform: scaleX(1); }
  .form-options { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; }
  .checkbox-label { display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--text-muted); }
  .checkbox-label input[type="checkbox"] { display: none; }
  .checkbox-box { width: 14px; height: 14px; border: 1px solid rgba(201,169,110,.3); display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: border-color .3s; }
  .forgot-link { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--text-muted); text-decoration: none; cursor: pointer; transition: color .3s; }
  .forgot-link:hover { color: var(--gold); }
  .btn-main { width: 100%; background: transparent; border: 1px solid var(--gold); color: var(--gold-light); font-family: 'Josefin Sans', sans-serif; font-size: 11px; letter-spacing: .35em; text-transform: uppercase; padding: 16px 32px; cursor: pointer; position: relative; overflow: hidden; transition: color .4s; margin-bottom: 20px; }
  .btn-main::before { content: ''; position: absolute; inset: 0; background: var(--gold); transform: scaleX(0); transform-origin: left; transition: transform .4s cubic-bezier(.4,0,.2,1); z-index: 0; }
  .btn-main:hover::before { transform: scaleX(1); }
  .btn-main:hover { color: var(--dark); }
  .btn-main:disabled { opacity: .6; cursor: not-allowed; }
  .btn-main span { position: relative; z-index: 1; }
  .btn-main.success { border-color: #5a9e6f; color: #5a9e6f; }
  .btn-main.success::before { background: rgba(90,158,111,.1); transform: scaleX(1); }
  .msg { font-size: 11px; letter-spacing: .1em; text-align: center; margin-bottom: 16px; padding: 10px; opacity: 0; transform: translateY(-4px); transition: opacity .3s, transform .3s; }
  .msg.show { opacity: 1; transform: translateY(0); }
  .msg.error { color: #d97070; border: 1px solid rgba(217,112,112,.2); }
  .msg.success-msg { color: #5a9e6f; border: 1px solid rgba(90,158,111,.2); }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
  @media (max-width: 768px) { .layout { grid-template-columns: 1fr; } .panel-left { display: none; } .panel-right { background: var(--dark); padding: 40px 28px; } }
</style>
</head>
<body>

<div class="bg"></div>
<div class="grid-lines"></div>
<div class="corner corner-tl"><svg viewBox="0 0 100 100" fill="none"><path d="M10 10 L10 50 M10 10 L50 10" stroke="#c9a96e" stroke-width="1"/><circle cx="10" cy="10" r="2" fill="#c9a96e"/></svg></div>
<div class="corner corner-tr"><svg viewBox="0 0 100 100" fill="none"><path d="M10 10 L10 50 M10 10 L50 10" stroke="#c9a96e" stroke-width="1"/><circle cx="10" cy="10" r="2" fill="#c9a96e"/></svg></div>
<div class="corner corner-bl"><svg viewBox="0 0 100 100" fill="none"><path d="M10 10 L10 50 M10 10 L50 10" stroke="#c9a96e" stroke-width="1"/><circle cx="10" cy="10" r="2" fill="#c9a96e"/></svg></div>
<div class="corner corner-br"><svg viewBox="0 0 100 100" fill="none"><path d="M10 10 L10 50 M10 10 L50 10" stroke="#c9a96e" stroke-width="1"/><circle cx="10" cy="10" r="2" fill="#c9a96e"/></svg></div>

<div class="layout">

  <div class="panel-left">
    <div class="brand-mark">
      <div class="brand-icon"><span></span></div>
      <div class="brand-name">1A3 Class Server</div>
    </div>
    <h1 class="headline">Your class.<br>Your space.<br><em>Elevated</em><br>access.</h1>
    <p class="tagline">A dedicated server reserved<br>for 1A3 members — curated,<br>private, and always ready.</p>
    <div class="diamonds">
      <div class="diamond" style="width:60px;height:60px;left:0;top:0;"></div>
      <div class="diamond" style="width:36px;height:36px;left:70px;top:30px;opacity:.6;"></div>
      <div class="diamond" style="width:18px;height:18px;left:20px;top:70px;opacity:.4;"></div>
    </div>
  </div>

  <div class="panel-right">
    <div class="login-card">

      <div class="login-header">
        <div class="divider-line"><div class="divider-gem"></div></div>
        <h2 class="login-title" id="formTitle">Sign In</h2>
        <p class="login-subtitle" id="formSubtitle">Welcome back, 1A3</p>
      </div>

      <div class="tabs">
        <button class="tab active" onclick="switchTab('login')">Sign In</button>
        <button class="tab" onclick="switchTab('register')">Register</button>
      </div>

      <div id="statusMsg" class="msg"></div>

      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <div class="input-wrap">
          <input class="form-input" type="email" id="email" placeholder="you@example.com" autocomplete="email">
          <div class="input-glow"></div>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <div class="input-wrap">
          <input class="form-input" type="password" id="password" placeholder="••••••••" autocomplete="current-password">
          <div class="input-glow"></div>
        </div>
      </div>

      <div class="form-group" id="confirmGroup" style="display:none;">
        <label class="form-label" for="confirmPassword">Confirm Password</label>
        <div class="input-wrap">
          <input class="form-input" type="password" id="confirmPassword" placeholder="••••••••">
          <div class="input-glow"></div>
        </div>
      </div>

      <div class="form-options" id="loginOptions">
        <label class="checkbox-label">
          <input type="checkbox" id="remember">
          <div class="checkbox-box"></div>
          Remember me
        </label>
        <span class="forgot-link">Forgot password?</span>
      </div>

      <button class="btn-main" id="submitBtn" onclick="handleSubmit()">
        <span id="btnText">Sign In</span>
      </button>

    </div>
  </div>
</div>

<script>
  const SERVER_URL = 'https://tristan-3.onrender.com';

  let mode = 'login';

  function switchTab(newMode) {
    mode = newMode;
    document.querySelectorAll('.tab').forEach((t, i) =>
      t.classList.toggle('active', (i === 0) === (newMode === 'login'))
    );
    document.getElementById('formTitle').textContent    = newMode === 'login' ? 'Sign In' : 'Create Account';
    document.getElementById('formSubtitle').textContent = newMode === 'login' ? 'Welcome back, 1A3' : 'Join 1A3 Class Server';
    document.getElementById('btnText').textContent      = newMode === 'login' ? 'Sign In' : 'Create Account';
    document.getElementById('confirmGroup').style.display = newMode === 'register' ? 'block' : 'none';
    document.getElementById('loginOptions').style.display = newMode === 'login'    ? 'flex'  : 'none';
    clearMsg();
    document.getElementById('submitBtn').classList.remove('success');
  }

  function showMsg(text, type) {
    const el = document.getElementById('statusMsg');
    el.textContent = text;
    el.className = `msg ${type} show`;
    if (type === 'error') setTimeout(() => el.classList.remove('show'), 5000);
  }

  function clearMsg() {
    document.getElementById('statusMsg').classList.remove('show');
  }

  async function handleSubmit() {
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const btn      = document.getElementById('submitBtn');
    const btnText  = document.getElementById('btnText');

    if (!email)    { showMsg('Please enter your email address.', 'error'); return; }
    if (!password) { showMsg('Please enter your password.', 'error'); return; }

    if (mode === 'register') {
      const confirm = document.getElementById('confirmPassword').value;
      if (password !== confirm) { showMsg('Passwords do not match.', 'error'); return; }
      if (password.length < 8)  { showMsg('Password must be at least 8 characters.', 'error'); return; }
    }

    btn.disabled = true;
    btnText.textContent = mode === 'login' ? 'Verifying…' : 'Creating account…';

    try {
      const endpoint = mode === 'login'
        ? `${SERVER_URL}/api/login`
        : `${SERVER_URL}/api/register`;

      const res  = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password }),
        credentials: 'include'
      });

      const data = await res.json();

      if (!res.ok) {
        showMsg(data.error || 'Something went wrong.', 'error');
        btn.disabled = false;
        btnText.textContent = mode === 'login' ? 'Sign In' : 'Create Account';
      } else {
        btn.classList.add('success');
        btnText.textContent = mode === 'login' ? '✓  Access Granted' : '✓  Account Created';
        showMsg(
          mode === 'login'
            ? `Welcome back, ${data.email}`
            : `Account created for ${data.email}`,
          'success-msg'
        );
        // Redirect to the 1A3 dashboard after short delay
        setTimeout(() => { window.location.href = 'dashboard.html'; }, 1200);
      }
    } catch (err) {
      showMsg('Could not reach the server. Is server.js running?', 'error');
      btn.disabled = false;
      btnText.textContent = mode === 'login' ? 'Sign In' : 'Create Account';
    }
  }

  ['email', 'password', 'confirmPassword'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.addEventListener('keydown', e => { if (e.key === 'Enter') handleSubmit(); });
  });
</script>
</body>
</html>
